[package]
name = "restarilo"
version = "0.1.0"
description = "Minimal restic GUI wrapper"
authors = ["you"]
edition = "2021"

[lib]
name = "restarilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
open = "5.4.5"
tauri-plugin-dialog = "2.8.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
